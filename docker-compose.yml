version: '3.8'

services:
  postgres_dw:
    image: postgres:16
    container_name: aviation_dw
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: aviation_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./script_creation.sql:/docker-entrypoint-initdb.d/script_creation.sql

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: aviation_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_dw

volumes:
  pgdata: